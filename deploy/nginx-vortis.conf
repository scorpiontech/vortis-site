# /etc/nginx/sites-available/vortis.conf
# Site ESTÁTICO (React/Vite prerenderizado) servido direto pelo Nginx.
# Sem Node, sem proxy reverso, sem systemd.
#
# Instalação:
#   sudo cp deploy/nginx-vortis.conf /etc/nginx/sites-available/vortis.conf
#   sudo ln -s /etc/nginx/sites-available/vortis.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS: sudo certbot --nginx -d vortisgestao.com.br -d www.vortisgestao.com.br

server {
    listen 80;
    listen [::]:80;
    server_name vortisgestao.com.br www.vortisgestao.com.br;

    root /var/www/vortis/app;
    index index.html;

    client_max_body_size 5m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml application/xml+rss text/xml image/svg+xml
               application/wasm font/ttf font/otf;

    # Assets com hash — cache longo e imutável
    location /_build/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
    location = /sitemap.xml { access_log off; }

    # HTML prerenderizado; se não existir, cai no SPA fallback.
    # O "=404" no final evita "rewrite or internal redirection cycle" (erro 500)
    # caso /index.html não exista na pasta publicada.
    location / {
        try_files $uri $uri/index.html $uri.html /index.html =404;
    }

    location = /404.html {
        internal;
    }

    error_page 404 /404.html;
}
