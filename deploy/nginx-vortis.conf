# /etc/nginx/sites-available/vortis.conf
# Proxy reverso para o SSR Node em 127.0.0.1:3000
# Assets estáticos servidos diretamente pelo Nginx a partir de /var/www/vortis/app/public.
#
# Instalação:
#   sudo cp deploy/nginx-vortis.conf /etc/nginx/sites-available/vortis.conf
#   sudo ln -s /etc/nginx/sites-available/vortis.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS: use certbot depois de subir em HTTP.
#   sudo certbot --nginx -d vortisgestao.com.br -d www.vortisgestao.com.br

server {
    listen 80;
    listen [::]:80;
    server_name vortisgestao.com.br www.vortisgestao.com.br;

    # Tamanho de upload (form contato etc.)
    client_max_body_size 5m;

    # Compressão
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml application/xml+rss text/xml image/svg+xml
               application/wasm font/ttf font/otf;

    root /var/www/vortis/app/public;

    # 1) Assets estáticos com hash — cache longo e imutável
    location /_build/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri @ssr;
    }

    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri @ssr;
    }

    # 2) Arquivos públicos (favicon, robots.txt, imagens do /public)
    location = /favicon.ico { access_log off; log_not_found off; try_files $uri @ssr; }
    location = /robots.txt  { access_log off; log_not_found off; try_files $uri @ssr; }

    # 3) Qualquer outro path -> SSR Node
    location / {
        try_files $uri @ssr;
    }

    location @ssr {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}
